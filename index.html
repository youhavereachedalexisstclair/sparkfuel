    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Spark Fuel | Small Business Research, Design & Strategy</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://sparkfuel.co/#website",
            "url": "https://sparkfuel.co/",
            "name": "Spark Fuel",
            "description": "Spark Fuel helps small businesses with research, brand identity, custom websites, social media, and strategy.",
            "publisher": { "@id": "https://sparkfuel.co/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://sparkfuel.co/#organization",
            "name": "Spark Fuel",
            "url": "https://sparkfuel.co/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://sparkfuel.co/favicon.svg"
            },
            "image": "https://sparkfuel.co/og-image.jpg",
            "description": "Your small business copilot for research, design, and strategy: from first idea to full launch.",
            "slogan": "Your small business copilot.",
            "founder": { "@id": "https://sparkfuel.co/#alexis" },
            "areaServed": "US",
            "priceRange": "$$",
            "knowsAbout": [
              "Small business strategy",
              "Brand identity",
              "Custom websites",
              "Social media",
              "Marketing campaigns",
              "Business operations"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Spark Fuel services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Strategy & Insights",
                    "description": "Brainstorming, market research, LLC setup, financial accounts, and trademark protection for new businesses."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Smart Tools & Systems",
                    "description": "Google Workspace, domain setup, tech integrations, automations, and tools for small business operations."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Visual Brand Identity",
                    "description": "Logo, color palette, typography, brand guide, photo direction, and tone of voice."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Custom Websites",
                    "description": "Custom-designed, mobile-friendly websites built with SEO in mind."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Social Media",
                    "description": "Account setup and refresh, brand alignment, and content calendars."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Campaigns & Content",
                    "description": "Campaign planning and creative across social, email, and ads."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Branded Merch & Materials",
                    "description": "Business cards, stickers, packaging, apparel, and print materials."
                  }
                }
              ]
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "url": "https://sparkfuel.co/contact",
              "contactType": "customer service",
              "availableLanguage": "English"
            }
          },
          {
            "@type": "Person",
            "@id": "https://sparkfuel.co/#alexis",
            "name": "Alexis",
            "jobTitle": "Founder",
            "worksFor": { "@id": "https://sparkfuel.co/#organization" },
            "url": "https://sparkfuel.co/#about",
            "description": "Founder of Spark Fuel, a research, design, and strategy partner for small businesses."
          },
          {
            "@type": "WebPage",
            "@id": "https://sparkfuel.co/#webpage",
            "url": "https://sparkfuel.co/",
            "name": "Spark Fuel | Small Business Research, Design & Strategy",
            "isPartOf": { "@id": "https://sparkfuel.co/#website" },
            "about": { "@id": "https://sparkfuel.co/#organization" },
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "url": "https://sparkfuel.co/og-image.jpg"
            },
            "description": "Spark Fuel helps small businesses with research, brand identity, custom websites, social media, and strategy."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; color: #e8edf5; background: #0e1218">
        <h1>Spark Fuel — Your small business copilot</h1>
        <p>
          Research, brand design, websites, and strategy for small businesses:
          from first idea to full launch.
        </p>
        <h2>Services</h2>
        <ul>
          <li>Strategy &amp; Insights</li>
          <li>Smart Tools &amp; Systems</li>
          <li>Visual Brand Identity</li>
          <li>Custom Websites</li>
          <li>Social Media</li>
          <li>Campaigns &amp; Content</li>
          <li>Branded Merch &amp; Materials</li>
        </ul>
        <form action="/api/contact" method="post" style="display: grid; gap: 0.75rem; margin-top: 1.5rem">
          <label>Name<br /><input name="name" required style="width: 100%; margin-top: 0.25rem" /></label>
          <label>Email<br /><input name="email" type="email" required style="width: 100%; margin-top: 0.25rem" /></label>
          <label>Message<br /><textarea name="message" required rows="5" style="width: 100%; margin-top: 0.25rem"></textarea></label>
          <button type="submit" style="justify-self: start; padding: 0.7rem 1.1rem; border: 0; border-radius: 999px; background: #c8f235; color: #0e1218; font-weight: 700">Send it</button>
        </form>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
